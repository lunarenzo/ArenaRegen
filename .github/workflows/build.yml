name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradle Wrapper executable
      run: chmod +x gradlew

    - name: Compute Build Version
      id: versioning
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BUILD_VER="1.6.2-MODERN-b${{ github.run_number }}-${SHORT_SHA}"
        echo "build_version=${BUILD_VER}" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      run: ./gradlew shadowJar -PcustomVersion=${{ steps.versioning.outputs.build_version }} --no-daemon

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArenaRegen-${{ steps.versioning.outputs.build_version }}
        path: build/libs/ArenaRegen-*.jar
